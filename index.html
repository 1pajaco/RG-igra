<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Game</title>
    <script type="importmap">
    {
        "imports": {
            "engine/": "../../../engine/",
            "dat": "../../../lib/dat.js",
            "glm": "../../../lib/glm.js"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
    <link rel="stylesheet" href="../../../engine/style.css">
</head>

<body>
    <div id="frontPage">
        <canvas id="canvas"></canvas>

        <div id="frontPageSquare">
            <div id="start" class="menuCard">
                <h1>Jože's Grand Escape!</h1>
                <div id="btnGroup">
                    <button id="btnStart">START</button>
                    <button id="btnOptions">OPTIONS</button>
                    <button id="btnInstructions">INSTRUCTIONS</button>
                </div>
            </div>

            <div id="instructions" class="menuCard hidden">
                <h2>Instructions</h2>
                <p>Movement: W A S D</p>
                <p>Jump: SpaceBar</p>
                <p>Run: LeftShift</p>
                <p>Interactions: E</p>
                <p>Pause Menu: P</p>
                <p>Toggle Light Mode: L</p>
                <button id="btnBack">BACK</button>
            </div>

            <div id="options" class="menuCard hidden">
                <h2>Options</h2>
                <div class="optionRow">
                    <label for="blurCheckbox">Blur</label>
                    <input type="checkbox" id="blurCheckbox" />
                </div>
                <div class="optionRow">
                    <label for="vignetteCheckbox">Vignette</label>
                    <input type="checkbox" id="vignetteCheckbox" />
                </div>
                <div class="optionRow">
                    <label for="bloomCheckbox">Bloom</label>
                    <input type="checkbox" id="bloomCheckbox" />
                </div>
                <button id="btnBackOptions">BACK</button>
            </div>
        </div>

        <div id="pauseOverlay" class="hidden">
            <div id="pauseMenu" class="menuCard">
                <h2>Paused</h2>
                <div id="pauseButtons">
                    <button id="btnResume">RESUME</button>
                </div>
            </div>
        </div>

        <div id="promptModal" class="prompt-modal">
            <div class="prompt-modal-inner">
                <h3 class="prompt-modal-title">Enter code</h3>
                <input id="promptInput" type="text" class="prompt-input" />
                <div class="prompt-actions">
                    <button id="promptSubmit" class="prompt-submit">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <div id="objectiveText" class="objective-text">
        <span id="objectiveLabel">Objective:</span>
        <span id="objectiveContent">Find the button to open the door and the note with the first part of the code.</span>
    </div>
    <div id="flashMessage" class="flash-message"></div>

    <div id="interactionUi">
        Press E to Interact
    </div>
</body>

</html>
