<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Game</title>
    <script type="importmap">
    {
        "imports": {
            "engine/": "../../../engine/",
            "dat": "../../../lib/dat.js",
            "glm": "../../../lib/glm.js"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
    <link rel="stylesheet" href="../../../engine/style.css">
</head>

<body>
    <div id="frontPage">
        <canvas id="canvas"></canvas>

        <div id="frontPageSquare">
            <div id="start" class="menuCard">
                <h1>Chicken Game</h1>
                <div id="btnGroup">
                    <button id="btnStart">START</button>
                    <button id="btnOptions">OPTIONS</button>
                    <button id="btnInstructions">INSTRUCTIONS</button>
                </div>
            </div>

            <div id="instructions" class="menuCard hidden">
                <h2>Instructions</h2>
                <p>Movement: W A S D</p>
                <p>Jump: SpaceBar</p>
                <p>Run: LeftShift</p>
                <p>Interactions: E</p>
                <p>PauseMenu: P</p>
                <button id="btnBack">BACK</button>
            </div>

            <div id="options" class="menuCard hidden">
                <h2>Options</h2>
                <div class="optionRow">
                    <label for="blurCheckbox">Blur</label>
                    <input type="checkbox" id="blurCheckbox" />
                </div>
                <button id="btnBackOptions">BACK</button>
            </div>
        </div>

        <div id="pauseOverlay" class="hidden">
            <div id="pauseMenu" class="menuCard">
                <h2>Paused</h2>
                <div id="pauseButtons">
                    <button id="btnResume">RESUME</button>
                </div>
            </div>
        </div>

        <div id="interactionUi">
            Press E to Interact
        </div>
    </div>
</body>

</html>
