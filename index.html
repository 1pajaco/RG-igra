<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Game</title>
    <script type="importmap">
    {
        "imports": {
            "engine/": "../../../engine/",
            "dat": "../../../lib/dat.js",
            "glm": "../../../lib/glm.js"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
    <link rel="stylesheet" href="../../../engine/style.css">
</head>

<body>
    <div id="frontPage">
        <canvas id="canvas"></canvas>

        <div id="frontPageSquare">
            <div id="start" class="menuCard">
                <h1>Chicken Game</h1>
                <div id="btnGroup">
                    <button id="btnStart">START</button>
                    <button id="btnOptions">OPTIONS</button>
                    <button id="btnInstructions">INSTRUCTIONS</button>
                </div>
            </div>

            <div id="instructions" class="menuCard hidden">
                <h2>Instructions</h2>
                <p>Movement: W A S D</p>
                <p>Jump: SpaceBar</p>
                <p>Run: LeftShift</p>
                <p>Interactions: E</p>
                <p>Pause Menu: P</p>
                <p>Toggle Light Mode: L</p>
                <button id="btnBack">BACK</button>
            </div>

            <div id="options" class="menuCard hidden">
                <h2>Options</h2>
                <div class="optionRow">
                    <label for="blurCheckbox">Blur</label>
                    <input type="checkbox" id="blurCheckbox" />
                </div>
                <button id="btnBackOptions">BACK</button>
            </div>
        </div>

        <div id="pauseOverlay" class="hidden">
            <div id="pauseMenu" class="menuCard">
                <h2>Paused</h2>
                <div id="pauseButtons">
                    <button id="btnResume">RESUME</button>
                    </div>
                </div>
            </div>

            <div id="promptModal" style="display:none; position:fixed; inset:0; align-items:center; justify-content:center; background: rgba(0,0,0,0.5); z-index:1000;">
                <div style="background:#fff; padding:20px; border-radius:8px; min-width:300px; box-shadow:0 6px 18px rgba(0,0,0,0.2);">
                    <h3 style="margin-top:0">Enter code</h3>
                    <input id="promptInput" type="text" style="width:100%; padding:8px; margin-bottom:12px; box-sizing:border-box;" />
                    <div style="text-align:right">
                        <button id="promptCancel" style="margin-right:8px;">Cancel</button>
                        <button id="promptSubmit">Submit</button>
                    </div>
                </div>
            </div>
            </div>
        </div>

        <div id="interactionUi">
            Press E to Interact
        </div>
    </div>
</body>

</html>
