<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Game</title>
    <script type="importmap">
    {
        "imports": {
            "engine/": "../../../engine/",
            "dat": "../../../lib/dat.js",
            "glm": "../../../lib/glm.js"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
    <link rel="stylesheet" href="../../../engine/style.css">
</head>

<body>
    <div id="frontPage">
        <canvas id="canvas"></canvas>

        <div id="frontPageSquare">
            <div id="start" class="menuCard">
                <h1>Chicken Game</h1>
                <div id="btnGroup">
                    <button id="btnStart">START</button>
                    <button id="btnInstructions">NAVODILA</button>
                </div>
            </div>

            <div id="instructions" class="menuCard hidden">
                <h2>Navodila</h2>
                <p>Premikanje: W A S D</p>
                <p>Interakcija: E</p>
                <button id="btnBack">NAZAJ</button>
            </div>
        </div>

        <div id="interactionUi">
            Press E to Interact
        </div>
    </div>
</body>

</html>
